services:
  app:
    build: .
    container_name: volume_stabilizer
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # Mount your music directory (read-only for safety)
      - ${MUSIC_DIR:-./music}:/music:ro
      # Output directory for stabilized DJ tracks
      - ${OUTPUT_DIR:-./output}:/output
      # Persistent SQLite database & cache
      - ${DATA_DIR:-./data}:/data
    environment:
      - VS_INPUT_ROOT=/music
      - VS_OUTPUT_ROOT=/output
      - VS_DATA_DIR=/data
      - VS_TARGET_LUFS=${VS_TARGET_LUFS:--10.0}
      - VS_PEAK_CEILING=${VS_PEAK_CEILING:--1.0}
      - VS_MAX_REDUCTION=${VS_MAX_REDUCTION:-3.0}
      - VS_BYPASS_TOLERANCE=${VS_BYPASS_TOLERANCE:-0.5}
      - VS_WORKERS=${VS_WORKERS:-0}
